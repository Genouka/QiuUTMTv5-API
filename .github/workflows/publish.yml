name: publish

# Publishing happens for a version tag (v1.2.3), for a published release, or on demand with an
# explicit version. Both Maven repositories are fed from the same build:
#
#   * GitHub Packages  - https://maven.pkg.github.com/Genouka/QiuUTMTv5-API (needs a token to read)
#   * GitHub Pages     - https://genouka.github.io/QiuUTMTv5-API/            (public, no token)
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (defaults to the tag, then to gradle.properties)'
        required: false

permissions:
  contents: write # push the gh-pages branch
  packages: write # push to GitHub Packages

jobs:
  publish:
    name: Publish the SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up the JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          fi
          version="${version#v}"
          if [ -z "$version" ]; then
            version="$(grep -E '^version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')"
            echo "No tag and no input - falling back to gradle.properties ($version)."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"

      # AAR + sources jar + raw classes jar + POM + Gradle module metadata, all under
      # com.undertalemodtool.avalonia:qiuutmtv5-api.
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :umapi:publishAllPublicationsToGitHubPackagesRepository -Pversion="${{ steps.version.outputs.version }}" --stacktrace

      - name: Stage the Maven repository for GitHub Pages
        run: ./gradlew :umapi:publishAllPublicationsToPagesRepository -Pversion="${{ steps.version.outputs.version }}" --stacktrace

      # GitHub Packages requires a token even to read, so the same artifacts are also served as a
      # plain static Maven repository from the gh-pages branch, which anyone can use.
      - name: Publish the Maven repository to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work="$(mktemp -d)"

          if git clone --quiet --depth 1 --branch gh-pages "$remote" "$work" 2>/dev/null; then
            echo "Reusing the existing gh-pages branch."
          else
            echo "Creating the gh-pages branch."
            git init --quiet --initial-branch=gh-pages "$work"
            git -C "$work" remote add origin "$remote"
          fi

          mkdir -p "$work/com/undertalemodtool/avalonia"
          rm -rf "$work/com/undertalemodtool/avalonia/qiuutmtv5-api/$version"
          cp -r umapi/build/maven-repo/com/undertalemodtool/avalonia/qiuutmtv5-api \
                "$work/com/undertalemodtool/avalonia/"

          cat > "$work/README.md" <<'EOF'
          # QiuUTMTv5-API Maven repository

          This branch is the public Maven repository of
          [QiuUTMTv5-API](https://github.com/Genouka/QiuUTMTv5-API). It is generated by
          `.github/workflows/publish.yml`; do not edit it by hand.

          ```kotlin
          repositories {
              maven { url = uri("https://genouka.github.io/QiuUTMTv5-API/") }
          }
          dependencies {
              implementation("com.undertalemodtool.avalonia:qiuutmtv5-api:VERSION")
          }
          ```
          EOF

          git -C "$work" add -A
          git -C "$work" -c user.name='github-actions[bot]' \
                         -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                         commit --quiet -m "Publish $version"
          git -C "$work" push --quiet origin gh-pages
          echo "Published $version to gh-pages."
