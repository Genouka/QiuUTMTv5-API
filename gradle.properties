# Coordinates the SDK is published under. The release workflow passes -Pversion=<tag> instead of
# editing this file, so the value here is only the default for local builds.
group=com.undertalemodtool.avalonia
version=0.9.2.0

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=false
android.nonTransitiveRClass=true

# Credentials for the GitHub Packages repository. Locally you can instead export GITHUB_ACTOR /
# GITHUB_TOKEN (a classic PAT with write:packages), which is what CI does.
#gpr.user=
#gpr.key=
